name: Build Android APK

on:
  push:
    branches: [android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy web assets into android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp public/index.html     android/app/src/main/assets/
          cp public/app.css        android/app/src/main/assets/
          cp public/guide.html     android/app/src/main/assets/
          cp public/icon-v2.svg    android/app/src/main/assets/
          cp public/manifest.json  android/app/src/main/assets/
          cp public/sw.js          android/app/src/main/assets/

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
        continue-on-error: true

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2 || true
          if [ -f gradlew ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK at: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-studio-debug
          path: ${{ steps.apk.outputs.apk_path }}
