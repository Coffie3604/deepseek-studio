name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check server
        run: node --check server.js
      - name: Syntax check frontend
        run: node --check public/sw.js
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'));console.log('package.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json','utf8'));console.log('manifest.json OK')"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - name: Scan for secrets
        run: |
          set +e
          fails=0
          scan() {
            local pattern="$1" label="$2" level="$3"
            if grep -rEn "$pattern" \
                --include='*.js' --include='*.html' --include='*.json' \
                --exclude-dir=node_modules --exclude-dir=.git \
                --exclude=package-lock.json . ; then
              echo "::$level::$label"
              [ "$level" = "error" ] && fails=1
            fi
          }
          scan 'sk-[a-zA-Z0-9]{20,}'    'Possible DeepSeek API key' warning
          scan 'AIza[a-zA-Z0-9_-]{30,}'  'Possible Google API key'   warning
          scan 'ghp_[a-zA-Z0-9]{30,}'    'GitHub PAT found'          error
          if find . -name '*.jks' -not -path './node_modules/*' | grep -q .; then
            echo '::error::Keystore file (.jks) found'
            fails=1
          fi
          exit $fails
      - name: Verify .gitignore
        run: |
          for pattern in 'node_modules' '*.jks' '*.keystore' '.env' '*.log'; do
            grep -q "$pattern" .gitignore || { echo "::error::.gitignore missing $pattern"; exit 1; }
          done

  endpoint-check:
    name: Endpoint & route check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Verify critical routes exist
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('server.js', 'utf8');
            const required = [
              '/api/fs/list','/api/fs/read','/api/fs/write',
              '/api/git/clone','/api/git/push','/api/git/pull',
              '/api/deploy/build','/api/deploy/check-tools',
              '/api/license/status','/api/backup/list',
              '/api/ai/tool-call','/api/exec','/api/compile'
            ];
            const missing = required.filter((ep) => !src.includes(ep));
            if (missing.length) { console.error('Missing:', missing); process.exit(1); }
            console.log('All critical routes present');
          "

  smoke:
    name: Server boot smoke test
    runs-on: ubuntu-latest
    env:
      HOME: /home/runner
      PORT: '3002'
      HOST: 127.0.0.1
      DS_WORKSPACE: /home/runner/deepseek-projects
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Boot server & curl endpoints
        run: |
          set -uo pipefail
          BASE="http://127.0.0.1:${PORT}"
          mkdir -p "$DS_WORKSPACE"
          node server.js > server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Server exited before becoming ready"
              cat server.log
              exit 1
            fi
            if curl -sf "$BASE/api/health" > /dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Server did not answer on $BASE within 20s"
            cat server.log
            exit 1
          fi

          set -e
          curl -sf "$BASE/api/health"          > /dev/null
          curl -sf "$BASE/api/version"         > /dev/null
          curl -sf "$BASE/api/fs/list"         > /dev/null
          curl -sf "$BASE/api/license/status"  > /dev/null
          echo "Smoke test passed on $BASE"
      - name: Show server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          else
            echo "server.log not created (server step failed before boot)"
          fi

  frontend:
    name: Frontend sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify assets referenced by index.html exist
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html', 'utf8');
            const refs = ['/manifest.json', '/icon-v2.svg', '/sw.js', '/app.css'];
            let fail = false;
            for (const r of refs) {
              const p = 'public' + r;
              if (!fs.existsSync(p)) { console.error('MISSING', p); fail = true; }
              else console.log('OK', p);
            }
            if (fail) process.exit(1);
          "
      - name: Check PWA manifest icons
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('public/manifest.json', 'utf8'));
            const required = ['name','short_name','start_url','display','icons'];
            let fail = false;
            for (const k of required) if (!m[k]) { console.error('Missing key:', k); fail = true; }
            (m.icons || []).forEach((i) => {
              const p = 'public' + i.src;
              if (!fs.existsSync(p)) { console.error('Icon missing:', p); fail = true; }
            });
            if (fail) process.exit(1);
            console.log('Manifest OK');
          "

  summary:
    name: Summary
    needs: [lint, security, endpoint-check, smoke, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo '═══════════════════════════════════'
          echo '  DeepSeek Studio — CI Summary'
          echo '═══════════════════════════════════'
          echo "  Lint:      ${{ needs.lint.result }}"
          echo "  Security:  ${{ needs.security.result }}"
          echo "  Endpoints: ${{ needs['endpoint-check'].result }}"
          echo "  Smoke:     ${{ needs.smoke.result }}"
          echo "  Frontend:  ${{ needs.frontend.result }}"
          echo '═══════════════════════════════════'
