name: DeepSeek Studio CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check server.js syntax
        run: node --check server.js

      - name: Check public/sw.js syntax
        run: node --check public/sw.js

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Verify all referenced files exist
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html','utf8');
            const refs = ['/manifest.json','/icon-v2.svg','/sw.js'];
            let fail = false;
            refs.forEach(r => {
              const p = 'public' + r;
              if (!fs.existsSync(p)) { console.error('MISSING: ' + p); fail = true; }
              else console.log('OK: ' + p);
            });
            if (fail) process.exit(1);
          "

      - name: Extract and check inline JS from index.html
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html','utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);
            if (!m) { console.log('No inline script found'); process.exit(0); }
            const vm = require('vm');
            try { new vm.Script(m[1]); console.log('Inline JS syntax OK'); }
            catch (e) { console.error('Inline JS syntax ERROR:', e.message); process.exit(1); }
          "

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: npm audit (report only, don't fail)
        run: npm audit --audit-level=high || true
      - name: Check for accidentally committed secrets
        run: |
          echo "Scanning for API keys, tokens, keystores..."
          if grep -rE "sk-[a-zA-Z0-9]{20,}" --include="*.js" --include="*.html" --include="*.json" . | grep -v node_modules | grep -v ".git/"; then
            echo "::warning::Possible DeepSeek API key found in code"
          fi
          if grep -rE "AIza[a-zA-Z0-9_-]{30,}" --include="*.js" --include="*.html" --include="*.json" . | grep -v node_modules; then
            echo "::warning::Possible Google API key found in code"
          fi
          if grep -rE "ghp_[a-zA-Z0-9]{30,}" . | grep -v node_modules; then
            echo "::error::GitHub token found in code!"
            exit 1
          fi
          if find . -name "*.jks" -not -path "./node_modules/*" | grep -q .; then
            echo "::error::Keystore file (.jks) found in repo!"
            find . -name "*.jks" -not -path "./node_modules/*"
            exit 1
          fi
          echo "No secrets found"

      - name: Verify .gitignore covers sensitive files
        run: |
          for pattern in "node_modules" "*.jks" "*.keystore" ".env"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "::error::.gitignore is missing pattern: $pattern"
              exit 1
            fi
          done
          echo ".gitignore covers sensitive patterns"

  endpoint-smoke-test:
    name: Endpoint Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: List all API endpoints in server.js
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('server.js','utf8');
            const eps = [...src.matchAll(/app\.(get|post|delete|put)\('([^']+)'/g)].map(m => m[1].toUpperCase() + ' ' + m[2]);
            console.log('Found ' + eps.length + ' endpoints:');
            eps.forEach(e => console.log('  ' + e));
          "

      - name: Verify critical endpoints exist
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('server.js','utf8');
            const required = [
              '/api/fs/list', '/api/fs/read', '/api/fs/write',
              '/api/git/clone', '/api/git/push', '/api/git/pull',
              '/api/deploy/build', '/api/deploy/check-tools',
              '/api/license/status', '/api/backup/list'
            ];
            let missing = [];
            required.forEach(ep => { if (!src.includes(ep)) missing.push(ep); });
            if (missing.length) { console.error('Missing endpoints:', missing); process.exit(1); }
            console.log('All critical endpoints present');
          "

  frontend-check:
    name: Frontend Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML structure
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html','utf8');
            const checks = [
              { name: 'DOCTYPE', ok: html.startsWith('<!DOCTYPE html>') },
              { name: 'has manifest link', ok: html.includes('rel=\"manifest\"') },
              { name: 'has theme-color', ok: html.includes('theme-color') },
              { name: 'has Monaco loader', ok: html.includes('monaco-editor') },
              { name: 'has xterm', ok: html.includes('xterm') },
              { name: 'has panel-ai', ok: html.includes('id=\"panel-ai\"') },
              { name: 'has panel-github', ok: html.includes('id=\"panel-github\"') },
              { name: 'has panel-deploy', ok: html.includes('id=\"panel-deploy\"') },
              { name: 'has panel-settings', ok: html.includes('id=\"panel-settings\"') },
              { name: 'has bindButtons', ok: html.includes('function bindButtons') },
              { name: 'has sendChat', ok: html.includes('async function sendChat') },
            ];
            let fail = false;
            checks.forEach(c => { console.log((c.ok ? 'OK   ' : 'FAIL ') + c.name); if (!c.ok) fail = true; });
            if (fail) process.exit(1);
          "

      - name: Check PWA manifest references
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/manifest.json','utf8'));
            const required = ['name','short_name','start_url','display','icons'];
            let fail = false;
            required.forEach(k => { if (!manifest[k]) { console.error('Missing manifest key: ' + k); fail = true; } });
            manifest.icons.forEach(i => {
              const p = 'public' + i.src;
              if (!fs.existsSync(p)) { console.error('Icon missing: ' + p); fail = true; }
            });
            if (fail) process.exit(1);
            console.log('Manifest OK');
          "

  summary:
    name: Build Summary
    needs: [lint-and-check, security-audit, endpoint-smoke-test, frontend-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "═══════════════════════════════════"
          echo "  DeepSeek Studio — CI Summary"
          echo "═══════════════════════════════════"
          echo "  Lint:        ${{ needs.lint-and-check.result }}"
          echo "  Security:    ${{ needs.security-audit.result }}"
          echo "  Endpoints:   ${{ needs.endpoint-smoke-test.result }}"
          echo "  Frontend:    ${{ needs.frontend-check.result }}"
          echo "═══════════════════════════════════"
