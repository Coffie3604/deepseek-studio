<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Left bracket < -->
  <path d="M 160 160 L 90 256 L 160 352"
        fill="none" stroke="url(#bracket)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right bracket > -->
  <path d="M 352 160 L 422 256 L 352 352"
        fill="none" stroke="url(#bracket)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- DeepSeek whale in the middle -->
  <g transform="translate(256, 256)">
    <!-- Whale body -->
    <path d="M -70 12
             Q -70 -40 -22 -40
             L 20 -40
             Q 70 -40 70 0
             Q 70 42 20 42
             L -8 42
             Q -8 60 -32 60
             Q -58 60 -58 42
             L -70 42
             Z"
          fill="url(#whale)"/>
    <!-- Whale eye -->
    <circle cx="38" cy="-14" r="7" fill="#0d1117"/>
    <!-- Tail fluke (back left) -->
    <path d="M -70 12 L -92 -10 L -78 12 L -92 34 L -70 12 Z"
          fill="url(#whale)"/>
  </g>
</svg>
